<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">静态恢复保留原始候选身份</title><desc id="desc">C 编译失败后，成功产物只有 A 和 B，但搜索身份仍来自 A、B、C。恢复先按原始身份读最佳配置 B，再在成功产物中寻找对应二进制。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#647892"/></marker></defs>
<rect width="960" height="530" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="36" y="48" font-size="28" fill="#172b46" font-weight="700" text-anchor="start"><tspan x="36" dy="0">原始候选、成功产物、最佳配置要分开</tspan></text><text x="36" y="80" font-size="18" fill="#52647a" font-weight="400" text-anchor="start"><tspan x="36" dy="0">示意场景：C 编译失败，A/B 成功，调优选中 B。</tspan></text><rect x="36" y="110" width="280" height="100" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="176.0" y="144" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="176.0" dy="0">原始候选 [A, B, C]</tspan></text><text x="176.0" y="174" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="176.0" dy="0">决定搜索身份</tspan></text><rect x="340" y="110" width="280" height="100" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="480.0" y="144" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="480.0" dy="0">成功产物 [A, B]</tspan></text><text x="480.0" y="174" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="480.0" dy="0">决定有哪些可恢复二进制</tspan></text><rect x="644" y="110" width="280" height="100" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="784.0" y="144" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="784.0" dy="0">最佳配置 B</tspan></text><text x="784.0" y="174" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="784.0" dy="0">决定先尝试复用谁</tspan></text><text x="36" y="258" font-size="23" fill="#172b46" font-weight="600" text-anchor="start"><tspan x="36" dy="0">恢复路径</tspan></text><rect x="36" y="286" width="270" height="108" rx="14" fill="#e9f5f1" stroke="#a9d6c7" stroke-width="2"/><text x="171.0" y="320" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="171.0" dy="0">保存的原始候选</tspan></text><text x="171.0" y="350" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="171.0" dy="0">计算同一 NPU 候选哈希</tspan></text><rect x="345" y="286" width="270" height="108" rx="14" fill="#e9f5f1" stroke="#a9d6c7" stroke-width="2"/><text x="480.0" y="320" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="480.0" dy="0">读取最佳配置 B</tspan></text><text x="480.0" y="350" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="480.0" dy="0">.best_config 身份匹配</tspan></text><rect x="654" y="286" width="270" height="108" rx="14" fill="#e9f5f1" stroke="#a9d6c7" stroke-width="2"/><text x="789.0" y="320" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="789.0" dy="0">从成功产物中匹配 B</tspan></text><text x="789.0" y="350" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="789.0" dy="0">参数包含 extra_options</tspan></text><path d="M 309 340 L 340 340" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 618 340 L 649 340" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="450" font-size="20" fill="#172b46" font-weight="600" text-anchor="start"><tspan x="36" dy="0">不能从 [A, B] 反推原始搜索身份：hash([A, B]) 与 hash([A, B, C]) 不同。</tspan></text><text x="36" y="490" font-size="19" fill="#52647a" font-weight="400" text-anchor="start"><tspan x="36" dy="0">身份匹配且 B 的产物存在，才收窄为 B；旧快照或产物缺失不能伪装成命中。</tspan></text>
</g></svg>