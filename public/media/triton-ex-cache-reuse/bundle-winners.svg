<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">混合候选的工件过滤</title><desc id="desc">只有多候选 kernel 登记 winner 时，A1 会被过滤。把 A1 和 B2 都登记为 winner，才能保留两个 kernel 的必要工件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#647892"/></marker></defs>
<rect width="960" height="570" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="36" y="48" font-size="28" fill="#172b46" font-weight="700" text-anchor="start"><tspan x="36" dy="0">单候选也必须登记 winner</tspan></text><text x="36" y="80" font-size="18" fill="#52647a" font-weight="400" text-anchor="start"><tspan x="36" dy="0">A 只有 A1；B 的候选是 B1、B2，调优选中 B2。</tspan></text><rect x="36" y="108" width="424" height="360" rx="16" fill="#fff4e6"/><text x="60" y="148" font-size="23" fill="#172b46" font-weight="600" text-anchor="start"><tspan x="60" dy="0">漏记 A1</tspan></text><text x="60" y="184" font-size="21" fill="#172b46" font-weight="400" text-anchor="start"><tspan x="60" dy="0">put 登记：{A1, B1, B2}</tspan></text><path d="M 248 201 L 248 235" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><text x="248" y="268" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="248" dy="0">winner 集合：{B2}</tspan></text><text x="248" y="302" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="248" dy="0">集合非空，按 winner 过滤</tspan></text><path d="M 248 319 L 248 353" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><text x="248" y="391" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="248" dy="0">仅保留 B2</tspan></text><text x="248" y="430" font-size="19" fill="#9b4c15" font-weight="400" text-anchor="middle"><tspan x="248" dy="0">必要的 A1 被遗漏</tspan></text><rect x="500" y="108" width="424" height="360" rx="16" fill="#e9f5f1"/><text x="524" y="148" font-size="23" fill="#172b46" font-weight="600" text-anchor="start"><tspan x="524" dy="0">完整记录</tspan></text><text x="524" y="184" font-size="21" fill="#172b46" font-weight="400" text-anchor="start"><tspan x="524" dy="0">put 登记：{A1, B1, B2}</tspan></text><path d="M 712 201 L 712 235" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><text x="712" y="268" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="712" dy="0">winner 集合：{A1, B2}</tspan></text><text x="712" y="302" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="712" dy="0">集合非空，按 winner 过滤</tspan></text><path d="M 712 319 L 712 353" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><text x="712" y="391" font-size="24" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="712" dy="0">保留 A1 和 B2</tspan></text><text x="712" y="430" font-size="19" fill="#216953" font-weight="400" text-anchor="middle"><tspan x="712" dy="0">两个 kernel 的依赖都在</tspan></text><text x="36" y="510" font-size="21" fill="#172b46" font-weight="600" text-anchor="start"><tspan x="36" dy="0">put 提供待收集工件；put_winner 提供最终选择。两者缺一不可。</tspan></text><text x="36" y="544" font-size="17" fill="#52647a" font-weight="400" text-anchor="start"><tspan x="36" dy="0">此图对应文中版本的过滤规则；winner 记录不等同于 .best_config。</tspan></text>
</g></svg>