<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">普通编译与 package 恢复</title><desc id="desc">普通路径经历图捕获、AOT、Inductor 和 kernel 编译。package 恢复可跳过 AOT 和 FX 的重新查找，但仍要校验并恢复运行依赖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#647892"/></marker></defs>
<rect width="960" height="680" rx="20" fill="#f4f7fb"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="36" y="48" font-size="28" fill="#172b46" font-weight="700" text-anchor="start"><tspan x="36" dy="0">普通编译与 package 恢复</tspan></text><text x="36" y="80" font-size="17" fill="#52647a" font-weight="400" text-anchor="start"><tspan x="36" dy="0">命中较早阶段的缓存，可以省去后续一部分编译；恢复仍需准备运行依赖。</tspan></text><text x="250" y="124" font-size="20" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="250" dy="0">普通编译主路径</tspan></text><text x="710" y="124" font-size="20" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="710" dy="0">已有 package 的恢复路径</tspan></text><rect x="40" y="148" width="420" height="84" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="250.0" y="182" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="250.0" dy="0">Dynamo 捕获</tspan></text><text x="250.0" y="212" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="250.0" dy="0">从 Python 执行捕获图</tspan></text><rect x="500" y="148" width="420" height="84" rx="14" fill="#e9f5f1" stroke="#a9d6c7" stroke-width="2"/><text x="710.0" y="182" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="710.0" dy="0">载入 package</tspan></text><text x="710.0" y="212" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="710.0" dy="0">读取保存的代码及产物关联</tspan></text><path d="M 250 234 L 250 256" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 710 234 L 710 256" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="260" width="420" height="84" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="250.0" y="294" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="250.0" dy="0">AOT 图处理</tspan></text><text x="250.0" y="324" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="250.0" dy="0">组织前后向编译</tspan></text><rect x="500" y="260" width="420" height="84" rx="14" fill="#e9f5f1" stroke="#a9d6c7" stroke-width="2"/><text x="710.0" y="294" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="710.0" dy="0">环境校验与 guard</tspan></text><text x="710.0" y="324" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="710.0" dy="0">判断保存结果能否用于当前调用</tspan></text><path d="M 250 346 L 250 368" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 710 346 L 710 368" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="372" width="420" height="84" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="250.0" y="406" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="250.0" dy="0">Inductor 编译</tspan></text><text x="250.0" y="436" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="250.0" dy="0">优化、调度与生成 wrapper</tspan></text><rect x="500" y="372" width="420" height="84" rx="14" fill="#e9f5f1" stroke="#a9d6c7" stroke-width="2"/><text x="710.0" y="406" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="710.0" dy="0">恢复后端编译结果</tspan></text><text x="710.0" y="436" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="710.0" dy="0">可能不重新计算 AOT / FX key</tspan></text><path d="M 250 458 L 250 480" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 710 458 L 710 480" fill="none" stroke="#647892" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="484" width="420" height="84" rx="14" fill="#ffffff" stroke="#c8d5e5" stroke-width="2"/><text x="250.0" y="518" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="250.0" dy="0">kernel 编译 / 调优</tspan></text><text x="250.0" y="548" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="250.0" dy="0">得到编译产物和候选选择</tspan></text><rect x="500" y="484" width="420" height="84" rx="14" fill="#e9f5f1" stroke="#a9d6c7" stroke-width="2"/><text x="710.0" y="518" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle"><tspan x="710.0" dy="0">恢复 kernel / 准备 launcher</tspan></text><text x="710.0" y="548" font-size="17" fill="#52647a" font-weight="400" text-anchor="middle"><tspan x="710.0" dy="0">加载必要产物与运行资源</tspan></text><text x="40" y="618" font-size="20" fill="#172b46" font-weight="600" text-anchor="start"><tspan x="40" dy="0">两条路径都以执行正确为目标；“找到条目”不等于“所有依赖已经可用”。</tspan></text><text x="40" y="652" font-size="17" fill="#52647a" font-weight="400" text-anchor="start"><tspan x="40" dy="0">图为主路径示意，省略图中断、延迟反向及逐层缓存分支。</tspan></text>
</g></svg>