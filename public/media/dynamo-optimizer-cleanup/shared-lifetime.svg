<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="shared-title shared-desc">
<title id="shared-title">共享参数与独立状态，按不同生命周期清理</title><desc id="shared-desc">捕获中 A 与 B 共享 p。p 的编译引用等待最后一个已跟踪 owner 销毁；A 独有状态随 A 清理，B 独有状态随 B 清理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68768e"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe" rx="18"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#25334b">
<text x="38" y="49" font-size="29" font-weight="600" fill="#4653ad">共享参数与独立状态，按不同生命周期清理</text>
<text x="38" y="88" font-size="22" font-weight="400" fill="#536379">这里的 owner 指捕获过程中已跟踪的优化器</text>
<rect x="40" y="124" width="262" height="86" rx="14" fill="#eef0fb" stroke="#d8deeb" stroke-width="1.5"/>
<text x="80" y="176" font-size="26" font-weight="600" fill="#4653ad">优化器 A</text>
<rect x="698" y="124" width="262" height="86" rx="14" fill="#eef0fb" stroke="#d8deeb" stroke-width="1.5"/>
<text x="738" y="176" font-size="26" font-weight="600" fill="#4653ad">优化器 B</text>
<rect x="350" y="253" width="300" height="114" rx="14" fill="#f1f7f5" stroke="#c6dcd3" stroke-width="1.5"/>
<text x="379" y="295" font-size="25" font-weight="600" fill="#246653">共同存活标记</text>
<text x="379" y="336" font-size="21" font-weight="400" fill="#536379">不强引用优化器</text>
<path d="M 302 166 H 330 V 283 H 346" fill="none" stroke="#68768e" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 698 166 H 670 V 283 H 654" fill="none" stroke="#68768e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="348" y="157" font-size="20" font-weight="400" fill="#536379">每个 owner 保留一份标记引用</text>
<rect x="40" y="412" width="262" height="100" rx="14" fill="#ffffff" stroke="#d8deeb" stroke-width="1.5"/>
<rect x="369" y="412" width="262" height="100" rx="14" fill="#f1f7f5" stroke="#c6dcd3" stroke-width="1.5"/>
<rect x="698" y="412" width="262" height="100" rx="14" fill="#ffffff" stroke="#d8deeb" stroke-width="1.5"/>
<path d="M 171 212 V 407" fill="none" stroke="#68768e" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 500 369 V 407" fill="none" stroke="#68768e" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M 829 212 V 407" fill="none" stroke="#68768e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="63" y="450" font-size="24" font-weight="600" fill="#25334b">A 独有状态</text>
<text x="63" y="488" font-size="20" font-weight="400" fill="#536379">随 A 的生命周期清理</text>
<text x="391" y="450" font-size="24" font-weight="600" fill="#246653">共享参数 p</text>
<text x="391" y="488" font-size="20" font-weight="400" fill="#536379">随共同标记清理</text>
<text x="721" y="450" font-size="24" font-weight="600" fill="#25334b">B 独有状态</text>
<text x="721" y="488" font-size="20" font-weight="400" fill="#536379">随 B 的生命周期清理</text>
<rect x="40" y="548" width="920" height="103" rx="14" fill="#f4f5fa" stroke="#d8deeb" stroke-width="1.5"/>
<text x="62" y="587" font-size="23" font-weight="400" fill="#25334b">A 销毁：释放 A 独有状态，p 仍保留。</text>
<text x="62" y="625" font-size="23" font-weight="400" fill="#25334b">B 也销毁：共同标记消失，解除 p 的编译引用。</text>
</g></svg>
